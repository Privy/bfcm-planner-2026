/* Opening band */
.privy-x-open { display: grid; gap: var(--privy-space-10); }
.privy-x-open-grid { display: grid; gap: var(--privy-space-10); }
@media (min-width: 900px) { .privy-x-open-grid { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: start; } }
.privy-x-open .privy-stats { padding-top: var(--privy-space-8); border-top: 1px solid rgb(243 252 245 / 0.14); }
.privy-x-next { display: grid; gap: var(--privy-space-3); }
.privy-x-next > .privy-label { color: rgb(243 252 245 / 0.78); margin: 0; }
.privy-x-next ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 0; }
.privy-x-next li { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: var(--privy-space-3); padding-block: var(--privy-space-3); border-top: 1px solid rgb(243 252 245 / 0.14); color: var(--privy-band-text); font-size: var(--privy-type-compact); }
.privy-x-next li span:first-child { color: rgb(243 252 245 / 0.78); font-variant-numeric: tabular-nums; }
.privy-x-next .privy-x-empty { color: rgb(243 252 245 / 0.78); font-size: var(--privy-type-compact); margin: 0; }

/* Timeline */
.privy-x-tl { overflow-x: auto; }
.privy-x-tl-inner { min-width: 760px; position: relative; }
.privy-x-tl-row { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--privy-space-6); align-items: center; padding-block: var(--privy-space-3); border-bottom: 1px solid var(--privy-border); }
.privy-x-tl-label { display: grid; gap: 2px; }
.privy-x-tl-label > * { margin: 0; }
.privy-x-tl-label a { color: var(--privy-text-strong); text-decoration: none; }
@media (hover: hover) { .privy-x-tl-label a:hover { text-decoration: underline; } }
.privy-x-tl-track { position: relative; height: 12px; }
.privy-x-tl-bar { position: absolute; top: 0; height: 12px; border-radius: var(--privy-radius-pill); background: var(--privy-chart-3); }
.privy-x-tl-bar.is-key { background: var(--privy-chart-1); }
.privy-x-tl-marks { position: absolute; top: 0; bottom: 28px; z-index: 1; left: calc(220px + var(--privy-space-6)); right: 0; pointer-events: none; }
.privy-x-tl-mark { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--privy-text-3); }
.privy-x-tl-mark.is-key { border-left: 1px solid var(--privy-text-strong); }
.privy-x-tl-mark em { position: absolute; top: 0; left: 6px; font-style: normal; font-size: var(--privy-type-caption); color: var(--privy-text-2); white-space: nowrap; }
.privy-x-tl-axis { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--privy-space-6); padding-top: var(--privy-space-2); }
.privy-x-tl-ticks { position: relative; height: 20px; }
.privy-x-tl-ticks span { position: absolute; transform: translateX(-50%); font-size: var(--privy-type-caption); color: var(--privy-text-2); white-space: nowrap; }
.privy-x-tl-pad { padding-top: 26px; }

/* Review: daily bars */
.privy-x-days { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(36px, 1fr); gap: 8px; align-items: end; height: 260px; overflow-x: auto; padding-top: 28px; }
.privy-x-day { display: grid; grid-template-rows: 1fr auto; height: 100%; gap: var(--privy-space-2); min-width: 28px; }
.privy-x-day-track { position: relative; display: flex; align-items: flex-end; }
.privy-x-day-bar { width: 100%; background: var(--privy-chart-5); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
.privy-x-day.is-key .privy-x-day-bar { background: var(--privy-chart-1); }
.privy-x-day-val { position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -4px); font-size: var(--privy-type-caption); color: var(--privy-text-strong); font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
.privy-x-day-lab { font-size: 12px; line-height: 1.25; color: var(--privy-text-2); text-align: center; white-space: nowrap; }
.privy-x-day.is-key .privy-x-day-lab { color: var(--privy-text-strong); font-weight: 500; }
.privy-x-review-grid { display: grid; gap: var(--privy-space-12); }
@media (min-width: 900px) { .privy-x-review-cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.privy-x-review-cols { display: grid; gap: var(--privy-space-12); align-items: start; }
.privy-x-review-cols .privy-stats { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.privy-x-hbars { display: grid; gap: var(--privy-space-4); }
.privy-x-hbar { display: grid; gap: var(--privy-space-1); }
.privy-x-hbar-top { display: flex; justify-content: space-between; gap: var(--privy-space-4); font-size: var(--privy-type-compact); }
.privy-x-hbar-top strong { font-weight: 500; font-variant-numeric: tabular-nums; }
.privy-x-hbar-track { height: 10px; background: var(--privy-surface-2); border-radius: var(--privy-radius-pill); overflow: hidden; }
.privy-x-hbar-fill { height: 100%; background: var(--privy-chart-1); border-radius: var(--privy-radius-pill); }
.privy-x-findings { list-style: none; margin: 0; padding: 0; display: grid; }
.privy-x-finding { display: grid; gap: var(--privy-space-2); padding-block: var(--privy-space-5); border-top: 1px solid var(--privy-border); }
@media (min-width: 900px) { .privy-x-finding { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--privy-space-8); } }
.privy-x-finding > div { display: grid; gap: var(--privy-space-1); align-content: start; }
.privy-x-finding p { margin: 0; }

/* Phases */
.privy-x-phase { display: grid; gap: var(--privy-space-6); padding-block: var(--privy-space-12); border-top: 1px solid var(--privy-border); }
.privy-x-phase:first-of-type { border-top: 0; }
.privy-x-phase-head { display: grid; gap: var(--privy-space-3); max-width: 44rem; }
.privy-x-phase-head > * { margin: 0; }
.privy-x-phase-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--privy-space-3); }
.privy-x-steps { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--privy-border); }
.privy-x-step { display: grid; grid-template-columns: 24px 4.5rem minmax(0, 1fr); gap: var(--privy-space-3); align-items: baseline; padding-block: var(--privy-space-4); border-top: 1px solid var(--privy-border); }
.privy-x-step input, .privy-x-caldone input {
  -webkit-appearance: none; appearance: none; flex-shrink: 0; width: 20px; height: 20px; margin: 0; transform: translateY(2px);
  border: 1.5px solid var(--privy-text-2); border-radius: 6px; background: var(--privy-surface);
  display: inline-grid; place-content: center; cursor: pointer;
}
.privy-x-step input::after, .privy-x-caldone input::after {
  content: ""; width: 10px; height: 5px; margin-top: -2px; border-left: 2px solid var(--privy-canvas); border-bottom: 2px solid var(--privy-canvas);
  transform: rotate(-45deg) scale(0); transition: transform 0.12s ease-out;
}
.privy-x-step input:checked, .privy-x-caldone input:checked { background: var(--privy-accent); border-color: var(--privy-accent); }
.privy-x-step input:checked::after, .privy-x-caldone input:checked::after { transform: rotate(-45deg) scale(1); }
.privy-x-step input:focus-visible, .privy-x-caldone input:focus-visible { outline: 2px solid var(--privy-accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .privy-x-step input::after, .privy-x-caldone input::after { transition: none; } }
:root[data-theme="light"] { color-scheme: light; }
.privy-x-step-date { font-size: var(--privy-type-compact); color: var(--privy-text-2); font-variant-numeric: tabular-nums; }
.privy-x-step-body { display: grid; gap: var(--privy-space-1); }
.privy-x-step-body > * { margin: 0; }
.privy-x-step-text { color: var(--privy-text-strong); }
.privy-x-step.is-done .privy-x-step-text { text-decoration: line-through; color: var(--privy-text-2); }
.privy-x-step details summary { cursor: pointer; font-size: var(--privy-type-caption); color: var(--privy-accent); list-style: none; }
.privy-x-step details summary::-webkit-details-marker { display: none; }
.privy-x-step details p { margin: var(--privy-space-2) 0 0; font-size: var(--privy-type-compact); color: var(--privy-text-2); max-width: 40rem; }
@media (max-width: 600px) { .privy-x-step { grid-template-columns: 24px minmax(0, 1fr); } .privy-x-step-date { grid-column: 2; } .privy-x-step-body { grid-column: 2; } }

/* Displays */
.privy-x-stages { list-style: none; margin-bottom: 0; padding: 0; border-bottom: 1px solid var(--privy-border); }
.privy-x-stages li { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: var(--privy-space-4); padding-block: var(--privy-space-4); border-top: 1px solid var(--privy-border); }
.privy-x-stages li p { margin: 0; }
.privy-x-when { font-size: var(--privy-type-compact); color: var(--privy-text-2); font-variant-numeric: tabular-nums; }
@media (max-width: 600px) { .privy-x-stages li { grid-template-columns: minmax(0, 1fr); gap: var(--privy-space-1); } }

/* Details */
.privy-x-details { border-top: 1px solid var(--privy-border); }
.privy-x-details:last-of-type { border-bottom: 1px solid var(--privy-border); }
.privy-x-details > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: var(--privy-space-4); min-height: 56px; font: 500 var(--privy-type-heading-s)/1.35 var(--privy-font-body); color: var(--privy-text-strong); }
.privy-x-details > summary::-webkit-details-marker { display: none; }
.privy-x-details > summary::after { content: "+"; font-weight: 400; color: var(--privy-text-2); }
.privy-x-details[open] > summary::after { content: "\2212"; }
.privy-x-details > div { display: grid; gap: var(--privy-space-4); padding-bottom: var(--privy-space-8); }
.privy-x-list { margin: 0; padding-inline-start: var(--privy-space-5); display: grid; gap: var(--privy-space-2); }

/* Interface polish */
.privy-x-step-text, .privy-x-phase-head p, .privy-x-finding p, .privy-x-stages p, .privy-x-next li, .privy-x-head .privy-lede { text-wrap: pretty; }
.privy-x-phase, .privy-x-step, .privy-section { scroll-margin-top: 80px; }
.privy-x-step-body { max-width: none; }
.privy-x-step label { cursor: pointer; }
.privy-x-step.is-target, .privy-x-step:target { background: var(--privy-highlight-bg); box-shadow: -12px 0 0 var(--privy-highlight-bg), 12px 0 0 var(--privy-highlight-bg); }
.privy-x-dayname { display: block; font-weight: 400; font-size: var(--privy-type-caption); color: var(--privy-text-2); }

.privy-x-offer-box { display: grid; gap: var(--privy-space-2); max-width: 44rem; }
.privy-x-offer-box > * { margin: 0; }
.privy-x-offer { font-family: var(--privy-font-display); font-weight: 500; font-size: var(--privy-type-heading-m); line-height: 1.25; letter-spacing: -0.01em; color: var(--privy-text-strong); text-wrap: balance; }

/* Closing */
.privy-x-band-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--privy-space-8); }

/* ---- v3: compact review, tabs, task groups ---- */
.privy-x-rv { display: grid; gap: var(--privy-space-10); }
@media (min-width: 900px) { .privy-x-rv { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: end; } }
.privy-x-rv .privy-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--privy-space-6); }
.privy-x-rv .privy-x-days { height: 170px; grid-auto-columns: minmax(18px, 1fr); gap: 4px; }
.privy-x-rv .privy-x-day { min-width: 18px; }
.privy-x-rv .privy-stat-value { font-size: var(--privy-type-heading-l); }
.privy-x-changes { list-style: none; margin-bottom: 0; padding: 0; border-bottom: 1px solid var(--privy-border); }
.privy-x-changes li { display: grid; gap: var(--privy-space-1); padding-block: var(--privy-space-4); border-top: 1px solid var(--privy-border); }
@media (min-width: 900px) { .privy-x-changes li { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--privy-space-8); } }
.privy-x-changes p { margin: 0; text-wrap: pretty; }
.privy-x-plan-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--privy-space-4); }
.privy-x-group { display: grid; gap: var(--privy-space-2); padding-top: var(--privy-space-8); }
.privy-x-group-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--privy-space-3); }
.privy-x-group-head > * { margin: 0; }
.privy-x-group .privy-x-steps { margin-top: var(--privy-space-2); }
.privy-x-meta { font-size: var(--privy-type-caption); color: var(--privy-text-2); margin: 0; }
.privy-x-skip { font-size: var(--privy-type-caption); color: var(--privy-text-2); margin: var(--privy-space-2) 0 0; }
[hidden] { display: none !important; }
/* ---- task row: area and status badges at the right ---- */
.privy-x-step-body { max-width: none; }
.privy-x-step-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--privy-space-2) var(--privy-space-6); }
.privy-x-step-head .privy-x-step-text { max-width: 38rem; min-width: 0; }
.privy-x-step-badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--privy-space-2); flex-shrink: 0; max-width: 100%; }
@media (max-width: 640px) { .privy-x-step-head { flex-wrap: wrap; } .privy-x-step-badges { justify-content: flex-start; } }
/* ---- nav centered, still scrollable when it overflows ---- */
.privy-x-nav li:first-child { margin-inline-start: auto; }
.privy-x-nav li:last-child { margin-inline-end: auto; }

/* ---- chart tooltip ---- */
.privy-x-chartwrap { position: relative; }
.privy-x-days:focus-visible { outline: 2px solid var(--privy-focus-ring, currentColor); outline-offset: 4px; border-radius: var(--privy-radius-xs); }
.privy-x-tip { position: absolute; z-index: 3; pointer-events: none; padding: 6px 10px; border-radius: var(--privy-radius-sm); background: var(--privy-primary-bg); color: var(--privy-primary-fg); font-size: var(--privy-type-caption); line-height: 1.4; white-space: nowrap; box-shadow: var(--privy-shadow-md); font-variant-numeric: tabular-nums; }
.privy-x-tip span { display: block; opacity: 0.85; }
.privy-x-day.is-active .privy-x-day-bar { box-shadow: 0 0 0 2px var(--privy-canvas), 0 0 0 4px var(--privy-accent); }
@media print { .privy-x-tip { display: none !important; } }

/* ---- consistent space under every section heading ---- */
.privy-section > .privy-x-head { margin-bottom: var(--privy-space-8); }
.privy-section > .privy-x-head + * { margin-top: 0; }

/* ---- starting point and what changes (approved layout) ---- */
/* the one bold element: last year's sale, day by day, on the brand band */
.sp { background: var(--privy-band); color: var(--privy-band-text); border-radius: var(--privy-radius-lg); padding: clamp(24px, 5vw, 56px); display: grid; gap: var(--privy-space-8); }
.sp-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--privy-space-2) var(--privy-space-8); }
.sp-head > * { margin: 0; }
.sp-head h3 { font: 500 var(--privy-type-heading-l)/1.15 var(--privy-font-display); letter-spacing: -0.02em; color: var(--privy-band-accent); }
.sp-src { font-size: var(--privy-type-compact); opacity: 0.8; }
.sp-chart { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: clamp(3px, 0.8vw, 10px); height: clamp(180px, 26vw, 260px); padding-top: 52px; }
.sp-col { display: grid; grid-template-rows: 1fr auto; gap: var(--privy-space-2); min-width: 0; }
.sp-track { position: relative; display: flex; align-items: flex-end; }
.sp-bar { width: 100%; border-radius: 3px 3px 0 0; background: color-mix(in srgb, var(--privy-band-text) 28%, transparent); }
.sp-col.is-sale .sp-bar { background: var(--privy-band-accent); }
.sp-ann { position: absolute; left: 50%; bottom: calc(100% + 0px); transform: translate(-50%, -8px); white-space: nowrap; text-align: center; font-size: var(--privy-type-compact); line-height: 1.3; }
.sp-ann b { font-weight: 600; color: var(--privy-band-accent); font-variant-numeric: tabular-nums; }
.sp-col:has(.sp-ann) .sp-track { padding-top: 0; }
.sp-lab { text-align: center; font-size: 12px; line-height: 1.25; opacity: 0.75; font-variant-numeric: tabular-nums; }
.sp-col.is-sale .sp-lab { opacity: 1; }
.sp-foot { margin: 0; font-size: var(--privy-type-compact); opacity: 0.8; max-width: 52rem; }
.sp-foot i { font-style: normal; display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--privy-band-accent); vertical-align: -1px; margin-inline-end: 6px; }

/* quiet: what Privy saw */
.pv { display: grid; gap: var(--privy-space-12); }
@media (min-width: 900px) { .pv { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--privy-space-16); } }
.pv-col { display: grid; gap: var(--privy-space-5); align-content: start; }
.pv-col > * { margin: 0; }
.pv-col h3 { font: 500 var(--privy-type-heading-s)/1.3 var(--privy-font-body); color: var(--privy-text-2); }
.pv-lead { font-size: var(--privy-type-lede); line-height: 1.4; color: var(--privy-text); max-width: 30rem; text-wrap: pretty; }
.pv-lead b { display: block; font: 500 var(--privy-type-stat)/1.05 var(--privy-font-display); letter-spacing: -0.03em; color: var(--privy-text-strong); font-variant-numeric: tabular-nums; margin-bottom: 6px; }
.pv-split { display: grid; gap: 6px; }
.pv-split-top { display: flex; justify-content: space-between; font-size: var(--privy-type-compact); color: var(--privy-text-2); }
.pv-split-top b { color: var(--privy-text-strong); font-weight: 600; font-variant-numeric: tabular-nums; margin-inline-start: 6px; }
.pv-bar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; background: var(--privy-surface-2); gap: 2px; }
.pv-bar span:first-child { background: var(--privy-chart-1); }
.pv-bar span:last-child { background: var(--privy-chart-3); }
.pv-note { color: var(--privy-text-2); max-width: 30rem; text-wrap: pretty; }
.pv-today { margin: 0; display: grid; gap: var(--privy-space-4); }
.pv-today div { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: var(--privy-space-4); align-items: baseline; }
.pv-today dd { margin: 0; font: 500 var(--privy-type-heading-m)/1.1 var(--privy-font-display); letter-spacing: -0.02em; color: var(--privy-text-strong); font-variant-numeric: tabular-nums; order: -1; }
.pv-today dt { color: var(--privy-text-2); text-wrap: pretty; }
@media (max-width: 600px) { .sp-wd { display: none; } .sp-lab { font-size: 11px; } .sp-ann { font-size: 12px; } .sp-chart { padding-top: 44px; } }

/* what changes: numbered list */
.nl { list-style: none; margin: 0; padding: 0; counter-reset: nl; }
.nl li { counter-increment: nl; display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: var(--privy-space-2) var(--privy-space-6); align-items: baseline; padding-block: var(--privy-space-6); border-top: 1px solid var(--privy-border); }
.nl li:last-child { border-bottom: 1px solid var(--privy-border); }
.nl li::before { content: counter(nl); font: 500 var(--privy-type-heading-l)/1 var(--privy-font-display); color: var(--privy-accent); font-variant-numeric: tabular-nums; }
.nl li > div > * { margin: 0; }
.nl-do { font: 500 var(--privy-type-heading-m)/1.3 var(--privy-font-display); letter-spacing: -0.01em; color: var(--privy-text-strong); text-wrap: balance; }
.nl-why { color: var(--privy-text-2); margin-top: var(--privy-space-1) !important; max-width: 40rem; text-wrap: pretty; }
.nl-task { font-size: var(--privy-type-compact); white-space: nowrap; }
@media (max-width: 700px) { .nl li { grid-template-columns: 2rem minmax(0, 1fr); } .nl-task { grid-column: 2; white-space: normal; } }

.pv { gap: var(--privy-space-6) !important; }
@media (min-width: 900px) { .pv { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); } }
.pv-card { background: var(--privy-surface); border-radius: var(--privy-radius-lg); box-shadow: 0 0 0 1px var(--privy-ring); padding: clamp(20px, 3vw, 32px); display: grid; gap: var(--privy-space-5); align-content: start; }
.pv-card > * { margin: 0; }
.pv-card h3 { font: 500 var(--privy-type-heading-m)/1.25 var(--privy-font-display); color: var(--privy-text-strong); margin: 0; }
.pv-callout { background: var(--privy-highlight-bg); color: var(--privy-highlight-fg); border-radius: var(--privy-radius-md); padding: var(--privy-space-4) var(--privy-space-5); font-size: var(--privy-type-body); line-height: 1.45; }
.pv-callout b { font: 500 var(--privy-type-heading-m)/1 var(--privy-font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-inline-end: 4px; }
.sp-chart:focus-visible { outline: 2px solid var(--privy-band-accent); outline-offset: 6px; border-radius: 4px; }
.sp { position: relative; }

      if (k === 'ArrowRight' || k === 'ArrowLeft' || k === 'Home' || k === 'End') { e.preventDefault(); show(k === 'Home' ? 0 : k === 'End' ? days.length - 1 : cur + (k === 'ArrowRight' ? 1 : -1)); }
      else if (k === 'Escape') hide();
    });
    document.addEventListener('pointerdown', function (e) { if (!box.contains(e.target)) hide(); });
    window.addEventListener('resize', function () { if (!tip.hidden && cur >= 0) show(cur); });
  })();

  var navLinks = [].slice.call(document.querySelectorAll('#nav a'));
  var navTargets = navLinks.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  function markNav() {
    var cur = -1;
    navTargets.forEach(function (el, i) { if (el && el.getBoundingClientRect().top <= 120) cur = i; });
    navLinks.forEach(function (a, i) { if (i === cur) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
    var ul = document.getElementById('nav'), act = navLinks[cur];
    if (act && (act.offsetLeft < ul.scrollLeft || act.offsetLeft + act.offsetWidth > ul.scrollLeft + ul.clientWidth)) ul.scrollTo({ left: Math.max(0, act.offsetLeft - 16), behavior: REDUCED ? 'auto' : 'smooth' });
  }
  window.addEventListener('scroll', markNav, { passive: true }); markNav();
  var themeBeforePrint = null;

    document.documentElement.setAttribute('data-theme', 'light');
  });

  function syncNote(text) {
    var n = document.getElementById('syncNote'), host = document.getElementById('view-wk');
    if (!n && host) { n = document.createElement('p'); n.id = 'syncNote'; n.className = 'privy-x-syncnote'; n.setAttribute('role', 'status'); host.parentNode.insertBefore(n, host); }
    if (n) n.textContent = text;
  }
  (async function connectProgress() {
    var db = null;
    var hook = window.planProgress || null; /* other hosts (a ChatGPT Site) supply { db, user } with the same interface */
    try { db = hook && hook.db ? hook.db : (window.claude && window.claude.use ? await window.claude.use('db') : null); } catch (e) { db = null; }
    if (!db) return;
    try { sharedUser = hook && hook.user ? hook.user : await window.claude.use('user'); if (sharedUser) me = (await sharedUser.id()) || ''; } catch (e) { sharedUser = null; }
    sharedDb = db;
    db.collection('progress').onSnapshot(function (snap) {
      var next = {};
      snap.docs.forEach(function (doc) { var v = doc.data() || {}; next[doc.id] = { done: !!v.done, by: String(v.by || ''), at: Number(v.at) || 0 }; });
      shared = next; refresh();
      var ids = Object.keys(next).map(function (k) { return next[k].by; }).filter(function (b) { return b && b !== 'planner' && !doneBy[b]; });
      if (ids.length && sharedUser && sharedUser.profiles) {
        sharedUser.profiles(Array.from(new Set(ids))).then(function (ps) { ids.forEach(function (i) { doneBy[i] = (ps[i] && ps[i].name) || ''; }); refresh(); }).catch(function () {});
      }
    }, function () { shared = null; sharedDb = null; refresh(); });
  })();
  (function themeToggle() {
    var btn = document.getElementById('themeToggle'); if (!btn) return;
    var root = document.documentElement, mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var MOON = '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><path d="M16 12.2A6.5 6.5 0 0 1 7.8 4a6.5 6.5 0 1 0 8.2 8.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
    var SUN = '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
    function current() { var t = root.getAttribute('data-theme'); return t === 'light' || t === 'dark' ? t : (mq && mq.matches ? 'dark' : 'light'); }
    function paint() { var dark = current() === 'dark'; btn.innerHTML = dark ? SUN : MOON; btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode'); btn.title = dark ? 'Light mode' : 'Dark mode'; }
    btn.addEventListener('click', function () {
      var next = current() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('privy-plan-theme', next); } catch (e) {}
      paint();

    if (mq && mq.addEventListener) mq.addEventListener('change', paint);
    paint();
  })();
})();
